name: resq_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.2.14+18

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.0  # Modern stable Leaflet mapping
  latlong2: ^0.9.1    # The absolute latest version maintained by the new team
  permission_handler: ^11.3.1  # Handles prompt popups
  geocoding: ^3.0.0
  geolocator: ^13.0.1          # Gets real-time GPS coordinates
  image_picker: ^1.1.2 
  http: ^1.6.0
  intl: ^0.19.0
  path: ^1.9.0
  path_provider: ^2.1.4
  flutter_map_cancellable_tile_provider: ^3.1.1
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.7
  pdf: ^3.12.0
  archive: ^3.6.1
  flutter_secure_storage: ^11.2.0
  audioplayers: ^6.7.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/sounds/

# App icons: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/logo.png
  android: true
  ios: false
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/logo.png
    icon_size: 256
